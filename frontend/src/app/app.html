<main class="app-shell">
  <header class="app-header">
    <div>
      <h1>8-Puzzle Solver</h1>
      <p class="subtitle">BFS, DFS, Iterative DFS and A* (Manhattan / Euclidean)</p>
    </div>
  </header>

  @if (errorMessage()) {
    <p class="error-message" role="alert">{{ errorMessage() }}</p>
  }

  <section class="workspace" aria-label="Puzzle workspace">
    <app-puzzle-board
      [state]="puzzleState()"
      [path]="solution()?.path ?? []"
      [selectedStep]="currentStep()"
      [disabled]="isSolving()"
      (stateChange)="onStateChange($event)"
      (pathStateChange)="onPathStateChange($event)"
      (stepChange)="onStepChange($event)"
      (solve)="solve($event)"
      (compare)="compare($event)"
    />
    <app-solution-tree
      [path]="solution()?.path ?? []"
      [actions]="solution()?.actions ?? []"
      [algorithm]="solution()?.algorithm"
      [currentStep]="currentStep()"
      (stepSelect)="onStepSelect($event)"
    />
  </section>

  <app-solution-path
    [path]="solution()?.path ?? []"
    [result]="solution()"
    [comparison]="comparison()"
    [loading]="isSolving()"
  />
</main>
